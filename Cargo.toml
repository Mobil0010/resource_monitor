[package]
name = "resource_monitor"
version = "1.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "links", "wgpu"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.38.4"
ureq = { version = "3.4.0", features = ["json"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow"] }
tray-icon = { version = "0.25.1", default-features = false }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
