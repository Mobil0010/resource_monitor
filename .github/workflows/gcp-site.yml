name: Deploy site to Google Cloud Run

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "deploy/**"
      - "Dockerfile"
      - ".gcloudignore"
      - ".dockerignore"
      - ".github/workflows/gcp-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-resource-monitor-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Deploy website
        run: >-
          gcloud run deploy resource-monitor-site
          --source .
          --project "${{ vars.GCP_PROJECT_ID }}"
          --region "${{ vars.GCP_REGION }}"
          --set-env-vars "DOWNLOAD_BUCKET=${{ vars.GCP_DOWNLOAD_BUCKET }}"
          --quiet
      - name: Show website address
        shell: bash
        run: |
          url=$(gcloud run services describe resource-monitor-site \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format="value(status.url)")
          echo "Website: ${url}"
          echo "### Resource Monitor website" >> "$GITHUB_STEP_SUMMARY"
          echo "${url}" >> "$GITHUB_STEP_SUMMARY"
