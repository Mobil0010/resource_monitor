name: Build and publish GitHub release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Increase patch version and create tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          IFS=. read -r major minor patch <<< "$current"
          version="$major.$minor.$((patch + 1))"
          tag="v$version"

          VERSION="$version" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          manifest = Path("Cargo.toml")
          text = manifest.read_text()
          text, count = re.subn(
              r'(?ms)(\A\[package\].*?^version\s*=\s*")[^"]+("\s*$)',
              rf'\g<1>{version}\g<2>',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Cargo.toml package version could not be updated")
          manifest.write_text(text)

          lockfile = Path("Cargo.lock")
          text = lockfile.read_text()
          text, count = re.subn(
              r'(?ms)(^\[\[package\]\]\nname = "resource_monitor"\nversion = ")[^"]+("\n)',
              rf'\g<1>{version}\g<2>',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Cargo.lock package version could not be updated")
          lockfile.write_text(text)
          PY

          cargo check --locked
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): $tag"
          git tag -a "$tag" -m "Resource Monitor $tag"
          git push origin HEAD:master "$tag"

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  macos:
    needs: prepare
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build universal DMG
        run: bash scripts/package-macos.sh "${{ needs.prepare.outputs.version }}"
      - name: Save macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Windows executable
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Build portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\portable\ResourceMonitor | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\resource_monitor.exe dist\portable\ResourceMonitor\ResourceMonitor.exe
          Copy-Item README.md dist\portable\ResourceMonitor\README.md
          Compress-Archive -Path dist\portable\ResourceMonitor -DestinationPath "dist\ResourceMonitor-${{ needs.prepare.outputs.version }}-Windows-Portable.zip"
      - name: Build Windows installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.prepare.outputs.version }}" "/DSourceExe=$pwd\target\x86_64-pc-windows-msvc\release\resource_monitor.exe" packaging\windows\resource-monitor.iss
      - name: Save Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*-Windows-Setup.exe
            dist/*-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: "*-packages"
          path: dist
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          files=(
            "dist/ResourceMonitor-$VERSION-macOS-Universal.dmg"
            "dist/ResourceMonitor-$VERSION-Windows-Setup.exe"
            "dist/ResourceMonitor-$VERSION-Windows-Portable.zip"
          )
          for file in "${files[@]}"; do test -s "$file"; done
          (cd dist && sha256sum ResourceMonitor-* > SHA256SUMS.txt)
          if gh release view "$tag" --json isDraft > release-state.json 2>/dev/null; then
            if ! jq -e '.isDraft == true' release-state.json > /dev/null; then
              echo "::error::This release is already published. Use a new version tag."
              exit 1
            fi
          else
            gh release create "$tag" --verify-tag --draft --title "Resource Monitor $tag" --generate-notes
          fi
          gh release upload "$tag" "${files[@]}" dist/SHA256SUMS.txt --clobber
          gh release edit "$tag" --draft=false
